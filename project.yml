# XcodeGen spec — GitHub's Mac turns this into an Xcode project at build time,
# so no Mac is needed on your side.
name: LiveSequence
options:
  bundleIdPrefix: com.livesequence
  deploymentTarget:
    iOS: "17.0"
targets:
  LiveSequence:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: LiveSequence
        PRODUCT_BUNDLE_IDENTIFIER: com.livesequence.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiveSequence
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Takes Live Photos in sequence."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Records sound for your Live Photos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Finds Live Photo sequences and saves the videos you make."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves your Live Photos and videos."
        # Sideloadly / AltStore sign the app with your Apple ID, so GitHub builds it unsigned.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
