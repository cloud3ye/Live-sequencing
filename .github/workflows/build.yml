name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project LiveSequence.xcodeproj \
            -target LiveSequence \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LiveSequence.app Payload/
          zip -qry LiveSequence.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveSequence-ipa
          path: LiveSequence.ipa
          retention-days: 30
